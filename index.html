<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Ферма з розведення тварин</title>
</head>
<body>
    <h1>Ферма з розведення кролів</h1>
    <p id="timer">Поточний час: </p>
    
    <label for="initialCount">Початкова кількість кролів:</label>
    <input type="number" id="initialCount" min="1">
    <button onclick="startFarm()">Підтвердити розведення</button>
    
    <p id="farmStatus"></p>
</body>
<script src="script.js"></script>
</html>
